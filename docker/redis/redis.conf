# =============================================================================
# SchoolMatica Redis Configuration
# Optimized for session management and caching
# =============================================================================

# -----------------------------------------------------------------------------
# Network Settings
# -----------------------------------------------------------------------------
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
daemonize no
supervised no
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile ""
databases 16

# -----------------------------------------------------------------------------
# Snapshotting (RDB Persistence)
# -----------------------------------------------------------------------------
# Save the database every:
# - 900 seconds if at least 1 key changed
# - 300 seconds if at least 10 keys changed
# - 60 seconds if at least 10000 keys changed
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# -----------------------------------------------------------------------------
# Replication (for future scaling)
# -----------------------------------------------------------------------------
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
# Password is set via environment variable REDIS_PASSWORD
# requirepass is configured at runtime

# Rename dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""

# -----------------------------------------------------------------------------
# Memory Management
# -----------------------------------------------------------------------------
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# -----------------------------------------------------------------------------
# Append Only File (AOF) Persistence
# -----------------------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# -----------------------------------------------------------------------------
# Lua Scripting
# -----------------------------------------------------------------------------
lua-time-limit 5000

# -----------------------------------------------------------------------------
# Slow Log
# -----------------------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# -----------------------------------------------------------------------------
# Latency Monitor
# -----------------------------------------------------------------------------
latency-monitor-threshold 0

# -----------------------------------------------------------------------------
# Event Notification
# -----------------------------------------------------------------------------
notify-keyspace-events ""

# -----------------------------------------------------------------------------
# Advanced Configuration
# -----------------------------------------------------------------------------
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
