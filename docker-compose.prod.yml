# =============================================================================
# SchoolMatica Production Docker Compose
# Full production deployment with all services
# =============================================================================
#
# Usage:
#   # Start all services
#   docker compose -f docker-compose.prod.yml up -d
#
#   # Start with nginx reverse proxy
#   docker compose -f docker-compose.prod.yml --profile with-nginx up -d
#
#   # Start with backup service
#   docker compose -f docker-compose.prod.yml --profile with-backup up -d
#
#   # Full production stack
#   docker compose -f docker-compose.prod.yml --profile with-nginx --profile with-backup up -d
#
# Required Environment Variables (set in .env.production):
#   - POSTGRES_PASSWORD
#   - NEXTAUTH_SECRET
#   - NEXTAUTH_URL
#
# =============================================================================

name: schoolmatica-prod

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: schoolmatica_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schoolmatica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-schoolmatica}
      TZ: ${TZ:-Africa/Johannesburg}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - postgres_prod_logs:/var/lib/postgresql/log
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schoolmatica} -d ${POSTGRES_DB:-schoolmatica}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - schoolmatica_internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Redis Cache & Session Store
  # ---------------------------------------------------------------------------
  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    container_name: schoolmatica_redis_prod
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: ${TZ:-Africa/Johannesburg}
    volumes:
      - redis_prod_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - schoolmatica_internal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Next.js Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        BUILD_ID: ${BUILD_ID:-}
    container_name: schoolmatica_app_prod
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-schoolmatica}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-schoolmatica}?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NextAuth secret required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NextAuth URL required}
      AUTH_TRUST_HOST: "true"
      # Redis connection
      REDIS_URL: "redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379"
      # Database connection settings
      DB_MAX_RETRIES: "30"
      DB_RETRY_INTERVAL: "2"
      # Application settings
      TZ: ${TZ:-Africa/Johannesburg}
    volumes:
      # Persist user uploads and generated files
      - app_uploads:/app/public/uploads
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - schoolmatica_internal
      - schoolmatica_external
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G  # Increased from 1G - Next.js apps need more memory under load
        reservations:
          cpus: '0.5'
          memory: 1G  # Increased from 512M for better baseline performance
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: schoolmatica_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    environment:
      TZ: ${TZ:-Africa/Johannesburg}
    depends_on:
      app:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - schoolmatica_external
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    profiles:
      - with-nginx

  # ---------------------------------------------------------------------------
  # Certbot (Let's Encrypt SSL)
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: schoolmatica_certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - schoolmatica_external
    profiles:
      - with-ssl

  # ---------------------------------------------------------------------------
  # Database Backup Service
  # ---------------------------------------------------------------------------
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    container_name: schoolmatica_backup_prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-schoolmatica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-schoolmatica}
      # Backup schedule (cron format)
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # S3 configuration (optional)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-af-south-1}
      REMOVE_LOCAL_AFTER_S3: ${REMOVE_LOCAL_AFTER_S3:-false}
      CLEANUP_S3_BACKUPS: ${CLEANUP_S3_BACKUPS:-false}
      # Run initial backup on startup
      RUN_INITIAL_BACKUP: ${RUN_INITIAL_BACKUP:-false}
      TZ: ${TZ:-Africa/Johannesburg}
    volumes:
      - backup_data:/backups
      - backup_logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - schoolmatica_internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    profiles:
      - with-backup

# =============================================================================
# Volumes
# =============================================================================
volumes:
  # Database
  postgres_prod_data:
    driver: local
  postgres_prod_logs:
    driver: local
  
  # Redis
  redis_prod_data:
    driver: local

  # App uploads (user-generated content)
  app_uploads:
    driver: local

  # Nginx
  nginx_cache:
    driver: local
  
  # Certbot/SSL
  certbot_webroot:
    driver: local
  certbot_certs:
    driver: local
  
  # Backups
  backup_data:
    driver: local
  backup_logs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  # Internal network (not exposed to host)
  schoolmatica_internal:
    driver: bridge
    internal: true
  
  # External network (exposed to host via nginx)
  schoolmatica_external:
    driver: bridge
